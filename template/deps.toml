# deps.toml
# Project tool dependencies

# Include pre-defined tool bundles:
#   "baseline" - Standalone modern CLI tools (25 tools, no Python/Perl)
#   "complete" - Comprehensive dev environment (56 tools)
# Note: user-level shell tools (atuin, zoxide, direnv, starship, tmux) are
# intentionally excluded — they belong in the user's machine substrate, not
# per-project flakes. See baselineTools in flake.nix for rationale.
[bundles]
# include = ["baseline"]

# Project-specific tools (in addition to bundles)
[tools]
# rust = "stable"       # "stable", "beta", "nightly", or specific: "1.75.0"
# python = "3.12"       # Nix provides interpreter; use uv for packages
# nodejs = "20"
# go = "1.22"
# uv = true             # Fast Python package manager

# Rust toolchain configuration (only used when rust is in [tools])
# [rust]
# components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
